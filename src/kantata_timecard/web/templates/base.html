<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kantata Time-Card Adjustments{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      --fg: #1a1a1a; --muted: #666; --bg: #fafafa; --card: #fff;
      --border: #e4e4e7; --accent: #2563eb; --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
           color: var(--fg); background: var(--bg); line-height: 1.45; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px;
             display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; margin: 0; }
    header nav { display: flex; gap: 16px; align-items: center; font-size: 14px; }
    main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--muted); background: #f4f4f5; font-size: 12px;
         text-transform: uppercase; letter-spacing: 0.04em; }
    tr:hover td { background: #fafafa; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input[type=text], input[type=date], input[type=number], select, textarea {
      padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; font-family: inherit; min-width: 140px;
    }
    textarea { min-width: 320px; min-height: 60px; }
    button, .btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
                   background: var(--card); cursor: pointer; font-size: 14px; font-family: inherit;
                   text-decoration: none; color: inherit; display: inline-block; }
    button.primary, .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.danger, .btn.danger { background: var(--danger); color: white; border-color: var(--danger); }
    button:hover { filter: brightness(0.96); }
    .muted { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    .bulk-bar { position: sticky; bottom: 0; background: #1f2937; color: white; padding: 12px 16px;
                border-radius: 8px; display: none; align-items: center; gap: 16px; }
    .bulk-bar.active { display: flex; }
    .bulk-bar button { background: white; color: #1f2937; }
    .bulk-bar .count { font-weight: 600; }
    form.inline { display: inline; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px;
            background: #e0e7ff; color: #3730a3; }
    .pill.no { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <header>
    <h1>Kantata Time-Card Adjustments</h1>
    <nav>
      {% if request.session.get("user_id") %}
        <span class="muted">{{ request.session.get("user_name") }}</span>
        <form method="post" action="/logout" class="inline">
          <button type="submit">Sign out</button>
        </form>
      {% else %}
        <a class="btn primary" href="/login">Sign in with Kantata</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
